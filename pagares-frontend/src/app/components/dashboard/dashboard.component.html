<div class="dashboard-container">
  <header class="dashboard-header">
    <h1>Sistema de Gestión de Pagarés</h1>
    <div class="user-info">
      <span *ngIf="currentUser">Hola, {{ currentUser.nombre }}</span>
      <span class="role-badge">{{ currentUser?.rol }}</span>
      <button (click)="logout()">Cerrar Sesión</button>
    </div>
  </header>

  <div class="dashboard-content">
    <div class="stats-cards">
      <div class="stat-card">
        <h3>Total Pagarés</h3>
        <p class="stat-number">{{ totalPagares }}</p>
      </div>
      <div class="stat-card">
        <h3>Activos</h3>
        <p class="stat-number">{{ pagaresActivos }}</p>
      </div>
      <div class="stat-card">
        <h3>Pagados</h3>
        <p class="stat-number">{{ pagaresPagados }}</p>
      </div>
    </div>

    <div class="actions">
      <button (click)="goToPagares()">Ver Pagarés</button>
      <button (click)="goToCreatePagare()" *ngIf="currentUser?.rol === 'administrador'">
        Crear Pagaré
      </button>
    </div>
  </div>
</div>
