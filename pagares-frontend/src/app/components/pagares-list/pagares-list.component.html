<div class="pagares-list-container">
  <header class="page-header">
    <div class="header-left">
      <button (click)="goToDashboard()" class="btn-back">← Dashboard</button>
      <h1>Pagarés</h1>
    </div>
    <button (click)="goToCreate()" class="btn-create">Crear Pagaré</button>
  </header>

  <div *ngIf="loading" class="loading">Cargando...</div>

  <div *ngIf="!loading && pagares.length === 0" class="empty-state">
    <p>No hay pagarés registrados</p>
  </div>

  <div *ngIf="!loading && pagares.length > 0" class="pagares-grid">
    <div class="pagare-card" *ngFor="let pagare of pagares">
      <div class="pagare-header">
        <h3>{{ pagare.numeroExpediente }}</h3>
      </div>
      <div class="pagare-details">
        <p><strong>Monto:</strong> ${{ pagare.monto }}</p>
        <p><strong>Beneficiario:</strong> {{ pagare.beneficiario }}</p>
        <p><strong>Vencimiento:</strong> {{ formatDate(pagare.fechaVencimiento) }}</p>
        <p><strong>Lugar Pago:</strong> {{ pagare.lugarPago }}</p>
      </div>
      <div class="pagare-actions">
        <button (click)="viewPagare(pagare.idPagare)">Ver</button>
        <button (click)="editPagare(pagare.idPagare)">Editar</button>
        <button (click)="deletePagare(pagare.idPagare)" class="danger">Eliminar</button>
      </div>
    </div>
  </div>
</div>
