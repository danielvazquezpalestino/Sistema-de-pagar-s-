<div class="pagare-form-container">
  <header class="form-header">
    <div class="header-content">
      <button (click)="goToDashboard()" class="btn-back">← Dashboard</button>
      <h1>{{ isEditMode ? 'Editar Pagaré' : 'Crear Pagaré' }}</h1>
    </div>
  </header>

  <div *ngIf="loading && isEditMode" class="loading-message">
    Cargando datos del pagaré...
  </div>

  <div *ngIf="error" class="error-message">
    {{ error }}
  </div>

  <form *ngIf="!loading || !isEditMode" (ngSubmit)="onSubmit()" class="pagare-form">
    <div class="form-group">
      <label for="numeroExpediente">Número de Expediente *</label>
      <input 
        type="text" 
        id="numeroExpediente" 
        [(ngModel)]="pagare.numeroExpediente" 
        name="numeroExpediente"
        required
        placeholder="EXP-2024-001"
      >
    </div>

    <div class="form-group">
      <label for="monto">Monto *</label>
      <input 
        type="number" 
        id="monto" 
        [(ngModel)]="pagare.monto" 
        name="monto"
        required
        min="0"
        step="0.01"
        placeholder="0.00"
      >
    </div>

    <div class="form-group">
      <label for="promesaPago">Promesa de Pago *</label>
      <textarea 
        id="promesaPago" 
        [(ngModel)]="pagare.promesaPago" 
        name="promesaPago"
        required
        rows="3"
        placeholder="Descripción de la promesa de pago"
      ></textarea>
    </div>

    <div class="form-group">
      <label for="beneficiario">Beneficiario *</label>
      <input 
        type="text" 
        id="beneficiario" 
        [(ngModel)]="pagare.beneficiario" 
        name="beneficiario"
        required
        placeholder="Nombre del beneficiario"
      >
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="fechaElaboracion">Fecha de Elaboración *</label>
        <input 
          type="date" 
          id="fechaElaboracion" 
          [(ngModel)]="pagare.fechaElaboracion" 
          name="fechaElaboracion"
          required
        >
      </div>

      <div class="form-group">
        <label for="fechaVencimiento">Fecha de Vencimiento *</label>
        <input 
          type="date" 
          id="fechaVencimiento" 
          [(ngModel)]="pagare.fechaVencimiento" 
          name="fechaVencimiento"
          required
        >
      </div>
    </div>

    <div class="form-group">
      <label for="lugarPago">Lugar de Pago *</label>
      <input 
        type="text" 
        id="lugarPago" 
        [(ngModel)]="pagare.lugarPago" 
        name="lugarPago"
        required
        placeholder="Ciudad o lugar de pago"
      >
    </div>

    <div class="form-group">
      <label for="lugarSuscripcion">Lugar de Suscripción *</label>
      <input 
        type="text" 
        id="lugarSuscripcion" 
        [(ngModel)]="pagare.lugarSuscripcion" 
        name="lugarSuscripcion"
        required
        placeholder="Ciudad o lugar de suscripción"
      >
    </div>

    <div class="form-group">
      <label for="firma">Firma</label>
      <input 
        type="text" 
        id="firma" 
        [(ngModel)]="pagare.firma" 
        name="firma"
        placeholder="Nombre de quien firma (opcional)"
      >
    </div>

    <div class="form-actions">
      <button type="button" (click)="onCancel()" class="btn-cancel">Cancelar</button>
      <button type="submit" [disabled]="loading" class="btn-submit">
        {{ loading ? 'Guardando...' : (isEditMode ? 'Actualizar Pagaré' : 'Crear Pagaré') }}
      </button>
    </div>
  </form>
</div>
