<div class="login-container">
  <div class="login-card">
    <h2>Iniciar Sesión</h2>
    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="correo">Correo:</label>
        <input
          id="correo"
          type="email"
          [(ngModel)]="correo"
          name="correo"
          required
          placeholder="admin@pagares.com"
        >
      </div>
      <div class="form-group">
        <label for="contrasena">Contraseña:</label>
        <input
          id="contrasena"
          type="password"
          [(ngModel)]="contrasena"
          name="contrasena"
          required
          placeholder="admin123"
        >
      </div>
      <!-- Campo de nombre aparece si es primer login (auto-registro) -->
      <div class="form-group" *ngIf="showNombreField">
        <label for="nombre">Nombre:</label>
        <input
          id="nombre"
          type="text"
          [(ngModel)]="nombre"
          name="nombre"
          required
          placeholder="Ingrese su nombre completo"
        >
      </div>
      <!-- Campo de rol aparece si es primer login (auto-registro) -->
      <div class="form-group" *ngIf="showRolField">
        <label for="rol">Rol:</label>
        <select
          id="rol"
          [(ngModel)]="rol"
          name="rol"
          required
        >
          <option value="abogado">Abogado</option>
          <option value="administrador">Administrador</option>
        </select>
      </div>
      <button type="submit" [disabled]="loading">
        {{ loading ? 'Cargando...' : (showNombreField ? 'Crear Cuenta' : 'Iniciar Sesión') }}
      </button>
      <div *ngIf="showNombreField" class="cancel-register">
        <button type="button" (click)="cancelRegister()">Cancelar registro</button>
      </div>
      <div *ngIf="error" class="error">{{ error }}</div>
    </form>
  </div>
</div>
